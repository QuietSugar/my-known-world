name: Go CI

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myknownworld_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myknownworld_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/myknownworld_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Format check
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          if [ -n "$unformatted" ]; then
            while IFS= read -r file; do echo "::error file=$file::Run gofmt -w $file"; done <<< "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Race-enabled tests
        run: go test -race ./... 2>&1 | tee go-test.log; test ${PIPESTATUS[0]} -eq 0
      - name: Surface Go test failure details
        if: always()
        run: |
          if [ -f go-test.log ]; then
            grep -E -B 4 -A 8 '(^FAIL|--- FAIL:|WARNING: DATA RACE|fatal error:|panic:|Error Trace:|Error:)' go-test.log | tail -n 40 | while IFS= read -r line; do echo "::error::$line"; done || true
          fi
      - name: Preserve Go test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-output
          path: go-test.log
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Read release version
        run: |
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          # Release archives must carry the tag documented in .env.example, so a
          # tag build also tags the loaded image with that version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "RELEASE_IMAGE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/quietsugar/my-known-world:ci
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-random-password/ci-only-url-safe-password-1234567890/' .env
          sed -i -E 's/^IMAGE_TAG=.*/IMAGE_TAG=ci/' .env
          sed -i "s|CMDB_APP_TOKEN=.*|CMDB_APP_TOKEN=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env
          sed -i "s|MYKNOWNWORLD_WRITE_TOKEN=.*|MYKNOWNWORLD_WRITE_TOKEN=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env
          sed -i 's/CMDB_SECRET_PROVIDER=/CMDB_SECRET_PROVIDER=file/' .env
          sed -i "s|CMDB_VAULT_KEY_BASE64=.*|CMDB_VAULT_KEY_BASE64=$(python3 -c 'import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())')|" .env
      - name: Start Compose stack
        run: docker compose up -d --no-build
      - name: Diagnose Compose startup failure
        if: failure()
        run: |
          docker compose ps --all | while IFS= read -r line; do echo "::error::$line"; done
          docker compose logs --no-color --tail=80 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Wait for healthy application
        run: |
          for attempt in $(seq 1 60); do
            container_id="$(docker compose ps -q app)"
            if [ -n "$container_id" ] && [ "$(docker inspect -f '{{.State.Health.Status}}' "$container_id")" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Assert container hardening
        run: |
          container_id="$(docker compose ps -q app)"
          test "$(docker inspect -f '{{.Config.User}}' "$container_id")" = '10001:10001'
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = true
          docker inspect -f '{{json .HostConfig.CapDrop}}' "$container_id" | grep -q 'ALL'
          docker inspect -f '{{json .HostConfig.SecurityOpt}}' "$container_id" | grep -q 'no-new-privileges'
          docker inspect -f '{{json .HostConfig.Tmpfs}}' "$container_id" | grep -q '/tmp'
      - name: Test API contract
        run: |
          if python3 scripts/smoke_test.py --base-url http://127.0.0.1:8080 > /tmp/api-smoke.log 2>&1; then
            cat /tmp/api-smoke.log
          else
            cat /tmp/api-smoke.log
            message="$(tail -n 1 /tmp/api-smoke.log | tr '%' ' ')"
            echo "::error title=API smoke failure::$message"
            exit 1
          fi
      - name: Test CMDB synthetic secret lifecycle
        run: |
          cmdb_token="$(sed -n 's/^CMDB_APP_TOKEN=//p' .env)"
          python3 scripts/cmdb_smoke_test.py --base-url http://127.0.0.1:8080 --token "$cmdb_token"
      - name: Test bundled web UI
        run: curl --fail --silent http://127.0.0.1:8080/ | grep -q 'MyKnownWorld'
      - name: Test the create API
        run: |
          write_token="$(sed -n 's/^MYKNOWNWORLD_WRITE_TOKEN=//p' .env)"
          python3 scripts/write_api_smoke_test.py --base-url http://127.0.0.1:8080 --token "$write_token"
      - name: Verify the runtime image bundles the documented commands
        run: |
          for command in myknownworld myknownworld-mcp myknownworld-markdown-import myknownworld-cmdb myknownworld-materialize; do
            docker compose exec -T app sh -c "command -v ${command}" > /dev/null
          done
      - name: Tear down test stack
        if: always()
        run: docker compose down -v
      - name: Tag release archive with the documented version
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker tag ghcr.io/quietsugar/my-known-world:ci "ghcr.io/quietsugar/my-known-world:${RELEASE_IMAGE_TAG}"
      - name: Export image artifact
        run: |
          tags=(ghcr.io/quietsugar/my-known-world:ci)
          if [[ -n "${RELEASE_IMAGE_TAG:-}" ]]; then
            tags+=("ghcr.io/quietsugar/my-known-world:${RELEASE_IMAGE_TAG}")
          fi
          docker save "${tags[@]}" -o /tmp/my-known-world-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: my-known-world-image-${{ github.run_id }}-${{ github.sha }}
          path: /tmp/my-known-world-image.tar
          retention-days: 90
      - name: Login to GitHub Container Registry
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || (github.event_name == 'release' && github.event.action == 'published' && startsWith(github.event.release.tag_name, 'v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release image to GHCR
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || (github.event_name == 'release' && github.event.action == 'published' && startsWith(github.event.release.tag_name, 'v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/quietsugar/my-known-world:${{ github.ref == 'refs/heads/master' && 'latest' || github.ref_name }}
            ghcr.io/quietsugar/my-known-world:${{ github.sha }}
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
      - name: Verify the published tag is anonymously pullable
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || (github.event_name == 'release' && github.event.action == 'published' && startsWith(github.event.release.tag_name, 'v'))
        run: |
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            published_tag=latest
          else
            published_tag="$GITHUB_REF_NAME"
          fi
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:quietsugar/my-known-world:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          status="$(curl -sS -o /dev/null -w '%{http_code}'             -H "Authorization: Bearer ${token}"             -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'             "https://ghcr.io/v2/quietsugar/my-known-world/manifests/${published_tag}")"
          if [[ "$status" != "200" ]]; then
            echo "::error title=GHCR tag is not anonymously pullable::ghcr.io/quietsugar/my-known-world:${published_tag} returned HTTP ${status} without credentials. Make the package public, or document a different pull path, before announcing the release."
            exit 1
          fi
          echo "anonymous pull of ghcr.io/quietsugar/my-known-world:${published_tag} succeeded"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: my-known-world-image-${{ github.run_id }}-${{ github.sha }}
          path: release-assets
      - name: Checksum container image
        run: cd release-assets && sha256sum my-known-world-image.tar > my-known-world-image.tar.sha256
      - name: Verify archive carries the documented image tag
        run: |
          python3 - "${{ github.ref_name }}" <<'PY'
          import json
          import sys
          import tarfile

          expected = "ghcr.io/quietsugar/my-known-world:" + sys.argv[1]
          with tarfile.open("release-assets/my-known-world-image.tar") as archive:
              manifest = json.load(archive.extractfile("manifest.json"))
          tags = [tag for entry in manifest for tag in entry.get("RepoTags", [])]
          print("release archive tags:", ", ".join(tags))
          if expected not in tags:
              sys.exit(f"release archive is missing {expected}; docker load + default Compose would fail")
          PY
      - name: Determine release channel
        id: channel
        run: |
          # A VERSION with a suffix (0.2.0-rc.1) marks a pre-release; a plain
          # version such as 0.1.0 marks an official release.
          if [[ "$(cat VERSION)" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MyKnownWorld ${{ github.ref_name }}
          body_path: docs/release-${{ github.ref_name }}.md
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: |
            release-assets/my-known-world-image.tar
            release-assets/my-known-world-image.tar.sha256
